        .vector-component .val {

        .info-badge {
            display: inline-block;

            background: rgba(255, 190, 11, 0.1);
            border: 1px solid var(--accent-tertiary);

        /* Loading animation */
        .loading {

            animation: spin 1s linear infinite;

        @keyframes spin {

        /* Glow effect */

            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }

<body>
    <!-- Background particles -->
    <div class="bg-particles" id="particles"></div>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Generate background particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 20 + 's';
            particle.style.animationDuration = (15 + Math.random() * 10) + 's';
            particlesContainer.appendChild(particle);
        }

        // ============================================================================
        // VECTOR MATHEMATICS LIBRARY
        // ============================================================================
        
        class Vector3 {
            constructor(x, y, z) {
                this.x = x || 0;
                this.y = y || 0;
                this.z = z || 0;
            }

            toArray() {
                return [this.x, this.y, this.z];
            }

            length() {
                return Math.sqrt(this.x * this.x + this.y * this.y + this.z * this.z);
            }

            normalize() {
                const len = this.length();
                if (len === 0) return new Vector3(0, 0, 0);
                return new Vector3(this.x / len, this.y / len, this.z / len);
            }

            dot(v) {
                return this.x * v.x + this.y * v.y + this.z * v.z;
            }

            cross(v) {
                return new Vector3(
                    this.y * v.z - this.z * v.y,
                    this.z * v.x - this.x * v.z,
                    this.x * v.y - this.y * v.x
                );
            }

            add(v) {
                return new Vector3(this.x + v.x, this.y + v.y, this.z + v.z);
            }

            subtract(v) {
                return new Vector3(this.x - v.x, this.y - v.y, this.z - v.z);
            }

            multiply(scalar) {
                return new Vector3(this.x * scalar, this.y * scalar, this.z * scalar);
            }

            clone() {
                return new Vector3(this.x, this.y, this.z);
            }
        }

        // ============================================================================
        // SNELL'S LAW IMPLEMENTATION (Vector Form)
        // ============================================================================
        
        function calculateSnellRefraction(incidentDir, normal, n1, n2) {
            // Normalize inputs
            const I = incidentDir.normalize();
            const N = normal.normalize();
            
            // Calculate eta (refractive index ratio)
            const eta = n1 / n2;
            
            // Calculate cosine of incident angle: cos(θi) = -I · N
            const cosI = -I.dot(N);
            
            // Calculate discriminant for total internal reflection check
            const sinT2 = eta * eta * (1.0 - cosI * cosI);
            
            // Total internal reflection occurs if sinT2 > 1
            if (sinT2 > 1.0) {
                return null; // Total internal reflection
            }
            
            // Calculate cosine of transmitted angle
            const cosT = Math.sqrt(1.0 - sinT2);
            
            // Snell's Law in vector form:
            // T = η·I + (η·cos(θi) - cos(θt))·N
            const T = I.multiply(eta).add(N.multiply(eta * cosI - cosT));
            
            return T.normalize();
        }

        // ============================================================================
        // FRESNEL EQUATIONS - Calculate reflection coefficient
        // ============================================================================
        
        function calculateFresnelReflectance(cosI, n1, n2) {
            const eta = n1 / n2;
            const sinT2 = eta * eta * (1.0 - cosI * cosI);
            
            if (sinT2 > 1.0) return 1.0; // Total internal reflection
            
            const cosT = Math.sqrt(1.0 - sinT2);
            const absCoI = Math.abs(cosI);
            
            // Fresnel equations for s and p polarization
            const Rs = Math.pow((n1 * absCoI - n2 * cosT) / (n1 * absCoI + n2 * cosT), 2);
            const Rp = Math.pow((n1 * cosT - n2 * absCoI) / (n1 * cosT + n2 * absCoI), 2);
            
            // Unpolarized light
            return (Rs + Rp) / 2;
        }

        // ============================================================================
        // CREATE ADVANCED TEXT LABEL
        // ============================================================================
        
        function createTextLabel(text, color = '#00d4ff', size = 0.5) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 1024;
            canvas.height = 256;
            
            // Clear and set font
            context.clearRect(0, 0, canvas.width, canvas.height);
            context.font = 'Bold 72px JetBrains Mono, monospace';
            context.fillStyle = color;
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            
            // Add glow effect
            context.shadowColor = color;
            context.shadowBlur = 20;
            context.fillText(text, 512, 128);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            
            const spriteMaterial = new THREE.SpriteMaterial({ 
                map: texture,
                transparent: true,
                depthTest: false,
                depthWrite: false
            });
            
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(size * 4, size, 1);
            
            return sprite;
        }

        // ============================================================================
        // CREATE ARROW HELPER
        // ============================================================================
        
        function createArrow(origin, direction, length, color, lineWidth = 0.05) {
            const group = new THREE.Group();
            
            // Create line
            const points = [
                new THREE.Vector3(origin.x, origin.y, origin.z),
                new THREE.Vector3(
                    origin.x + direction.x * length,
                    origin.y + direction.y * length,
                    origin.z + direction.z * length
                )
            ];
            
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ 
                color: color,
                linewidth: 2
            });
            const line = new THREE.Line(geometry, material);
            group.add(line);
            
            // Create arrow head (cone)
            const arrowGeom = new THREE.ConeGeometry(lineWidth * 3, lineWidth * 8, 8);
            const arrowMat = new THREE.MeshBasicMaterial({ color: color });
            const arrowHead = new THREE.Mesh(arrowGeom, arrowMat);
            
            // Position and orient arrow head
            const endPoint = points[1];
            arrowHead.position.copy(endPoint);
            
            // Orient the cone to point in the direction
            const axis = new THREE.Vector3(0, 1, 0);
            const dirVec = new THREE.Vector3(direction.x, direction.y, direction.z);
            arrowHead.quaternion.setFromUnitVectors(axis, dirVec);
            
            group.add(arrowHead);
            
            return group;
        }

        // ============================================================================
        // MAIN REACT COMPONENT
        // ============================================================================

        function RayTracingKernel() {
            const canvasRef = useRef(null);
            const sceneRef = useRef(null);
            const rendererRef = useRef(null);
            const animationRef = useRef(null);

            // State
            const [refractiveIndex, setRefractiveIndex] = useState(1.52);
            const [cubeSize, setCubeSize] = useState(3.0);
            const [incidentAngle, setIncidentAngle] = useState(30);
            const [rayCount, setRayCount] = useState(1);
            const [raySpread, setRaySpread] = useState(0);
            const [rotationSpeed, setRotationSpeed] = useState(0.5);
            const [viewMode, setViewMode] = useState('perspective');
            const [autoRotate, setAutoRotate] = useState(true);
            const [showNormals, setShowNormals] = useState(true);
            const [showLabels, setShowLabels] = useState(true);
            const [showVectors, setShowVectors] = useState(true);
            const [showGrid, setShowGrid] = useState(true);
            const [showReflection, setShowReflection] = useState(true);
            const [wavelength, setWavelength] = useState(550);

            const [vectorData, setVectorData] = useState({
                incident: new Vector3(0, 0, 0),
                normal: new Vector3(0, 0, 0),
                refracted: new Vector3(0, 0, 0),
                reflected: new Vector3(0, 0, 0)
            });

            const [stats, setStats] = useState({
                incidentAngle: 0,
                refractedAngle: 0,
                reflectedAngle: 0,
                criticalAngle: 0,
                fresnelReflectance: 0,
                totalRefractions: 0
            });

            useEffect(() => {
                if (!canvasRef.current) return;

                // ============================================================================
                // SCENE SETUP
                // ============================================================================
                
                const scene = new THREE.Scene();
                sceneRef.current = scene;
                
                // Sophisticated gradient background
                const canvas = document.createElement('canvas');
                canvas.width = 2;
                canvas.height = 512;
                const context = canvas.getContext('2d');
                const gradient = context.createLinearGradient(0, 0, 0, 512);
                gradient.addColorStop(0, '#0a0e27');
                gradient.addColorStop(0.5, '#1a1f3a');
                gradient.addColorStop(1, '#0a0e27');
                context.fillStyle = gradient;
                context.fillRect(0, 0, 2, 512);
                const bgTexture = new THREE.CanvasTexture(canvas);
                scene.background = bgTexture;
                
                // Camera setup
                const camera = new THREE.PerspectiveCamera(
                    50,
                    canvasRef.current.clientWidth / canvasRef.current.clientHeight,
                    0.1,
                    1000
                );
                
                // Renderer setup
                const renderer = new THREE.WebGLRenderer({ 
                    canvas: canvasRef.current,
                    antialias: true,
                    alpha: false
                });
                renderer.setSize(canvasRef.current.clientWidth, canvasRef.current.clientHeight);
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                rendererRef.current = renderer;

                // Position camera based on view mode
                const updateCameraPosition = () => {
                    switch(viewMode) {
                        case 'top':
                            camera.position.set(0, 18, 0);
                            camera.lookAt(0, 0, 0);
                            break;
                        case 'side':
                            camera.position.set(15, 0, 0);
                            camera.lookAt(0, 0, 0);
                            break;
                        case 'front':
                            camera.position.set(0, 0, 15);
                            camera.lookAt(0, 0, 0);
                            break;
                        default: // perspective
                            camera.position.set(10, 8, 10);
                            camera.lookAt(0, 0, 0);
                    }
                };
                updateCameraPosition();

                // ============================================================================
                // LIGHTING
                // ============================================================================
                
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                scene.add(ambientLight);
                
                const directionalLight1 = new THREE.DirectionalLight(0x00d4ff, 0.8);
                directionalLight1.position.set(10, 10, 10);
                directionalLight1.castShadow = true;
                scene.add(directionalLight1);
                
                const directionalLight2 = new THREE.DirectionalLight(0xff006e, 0.4);
                directionalLight2.position.set(-10, 5, -10);
                scene.add(directionalLight2);
                
                const pointLight = new THREE.PointLight(0xffbe0b, 0.5, 50);
                pointLight.position.set(0, 5, 0);
                scene.add(pointLight);

                // ============================================================================
                // GRID AND AXES
                // ============================================================================
                
                if (showGrid) {
                    const gridHelper = new THREE.GridHelper(25, 50, 0x00d4ff, 0x1a1f3a);
                    gridHelper.position.y = -cubeSize/2 - 0.5;
                    scene.add(gridHelper);
                    
                    const axesHelper = new THREE.AxesHelper(8);
                    scene.add(axesHelper);
                }

                // ============================================================================
                // GLASS CUBE - Ultra realistic
                // ============================================================================
                
                const cubeGeometry = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
                const cubeMaterial = new THREE.MeshPhysicalMaterial({
                    color: 0xaaccff,
                    transparent: true,
                    opacity: 0.1,
                    metalness: 0,
                    roughness: 0,
                    transmission: 0.98,
                    thickness: 2.0,
                    ior: refractiveIndex,
                    reflectivity: 1.0,
                    clearcoat: 1.0,
                    clearcoatRoughness: 0,
                    envMapIntensity: 1.5
                });
                
                const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
                cube.castShadow = true;
                cube.receiveShadow = true;
                scene.add(cube);

                // Add glowing edges to cube
                const edgesGeometry = new THREE.EdgesGeometry(cubeGeometry);
                const edgesMaterial = new THREE.LineBasicMaterial({ 
                    color: 0x00d4ff, 
                    linewidth: 2,
                    transparent: true,
                    opacity: 0.6
                });
                const edges = new THREE.LineSegments(edgesGeometry, edgesMaterial);
                cube.add(edges);

                // ============================================================================
                // RAY TRACING COMPUTATION
                // ============================================================================
                
                const halfSize = cubeSize / 2;
                let totalRefractionsCount = 0;
                
                // Generate multiple rays if rayCount > 1
                for (let i = 0; i < rayCount; i++) {
                    const angleOffset = rayCount > 1 ? (i - (rayCount - 1) / 2) * raySpread : 0;
                    const currentAngle = incidentAngle + angleOffset;
                    const angleRad = (currentAngle * Math.PI) / 180;
                    
                    // Starting point (left side, outside cube)
                    const startPoint = new Vector3(-8, 0, 0);
                    
                    // Incident direction
                    const incidentDir = new Vector3(
                        Math.cos(angleRad),
                        -Math.sin(angleRad),
                        0
                    ).normalize();
                    
                    // Find intersection with left face of cube
                    const tEntry = (-halfSize - startPoint.x) / incidentDir.x;
                    const entryPoint = new Vector3(
                        startPoint.x + incidentDir.x * tEntry,
                        startPoint.y + incidentDir.y * tEntry,
                        startPoint.z + incidentDir.z * tEntry
                    );

                    // Entry normal (pointing outward from left face)
                    const entryNormal = new Vector3(-1, 0, 0);

                    // ============================================================================
                    // INCIDENT RAY (Air to Glass)
                    // ============================================================================
                    
                    const incidentPoints = [
                        new THREE.Vector3(startPoint.x, startPoint.y, startPoint.z),
                        new THREE.Vector3(entryPoint.x, entryPoint.y, entryPoint.z)
                    ];
                    
                    const incidentGeom = new THREE.BufferGeometry().setFromPoints(incidentPoints);
                    const incidentMaterial = new THREE.LineBasicMaterial({ 
                        color: 0xff3366,
                        linewidth: 3
                    });
                    const incidentLine = new THREE.Line(incidentGeom, incidentMaterial);
                    scene.add(incidentLine);
                    
                    // Add glow to incident ray
                    const incidentGlowMaterial = new THREE.LineBasicMaterial({ 
                        color: 0xff3366,
                        linewidth: 8,
                        transparent: true,
                        opacity: 0.3
                    });
                    const incidentGlow = new THREE.Line(incidentGeom.clone(), incidentGlowMaterial);
                    scene.add(incidentGlow);

                    // ============================================================================
                    // NORMAL VECTOR at entry
                    // ============================================================================
                    
                    if (showNormals) {
                        const normalArrow = createArrow(
                            entryPoint,
                            entryNormal,
                            1.5,
                            0x00ff88
                        );
                        scene.add(normalArrow);
                        
                        if (showLabels) {
                            const normalLabel = createTextLabel('N₁', '#00ff88', 0.4);
                            normalLabel.position.set(
                                entryPoint.x - 2,
                                entryPoint.y + 0.5,
                                entryPoint.z
                            );
                            scene.add(normalLabel);
                        }
                    }

                    // ============================================================================
                    // REFRACTED RAY (Inside glass)
                    // ============================================================================
                    
                    const refractedDir = calculateSnellRefraction(
                        incidentDir,
                        entryNormal,
                        1.0,  // Air
                        refractiveIndex  // Glass
                    );

                    if (refractedDir) {
                        totalRefractionsCount++;
                        
                        // Find exit point (right face of cube)
                        const tExit = (halfSize - entryPoint.x) / refractedDir.x;
                        const exitPoint = new Vector3(
                            entryPoint.x + refractedDir.x * tExit,
                            entryPoint.y + refractedDir.y * tExit,
                            entryPoint.z + refractedDir.z * tExit
                        );

                        // Draw refracted ray inside cube
                        const refractedPoints = [
                            new THREE.Vector3(entryPoint.x, entryPoint.y, entryPoint.z),
                            new THREE.Vector3(exitPoint.x, exitPoint.y, exitPoint.z)
                        ];
                        
                        const refractedGeom = new THREE.BufferGeometry().setFromPoints(refractedPoints);
                        const refractedMaterial = new THREE.LineBasicMaterial({ 
                            color: 0xffbe0b,
                            linewidth: 3
                        });
                        const refractedLine = new THREE.Line(refractedGeom, refractedMaterial);
                        scene.add(refractedLine);
                        
                        // Glow
                        const refractedGlowMaterial = new THREE.LineBasicMaterial({ 
                            color: 0xffbe0b,
                            linewidth: 8,
                            transparent: true,
                            opacity: 0.3
                        });
                        const refractedGlow = new THREE.Line(refractedGeom.clone(), refractedGlowMaterial);
                        scene.add(refractedGlow);

                        // ============================================================================
                        // EXIT RAY (Glass to Air)
                        // ============================================================================
                        
                        const exitNormal = new Vector3(1, 0, 0);
                        
                        if (showNormals) {
                            const exitNormalArrow = createArrow(
                                exitPoint,
                                exitNormal,
                                1.5,
                                0x00ff88
                            );
                            scene.add(exitNormalArrow);
                            
                            if (showLabels) {
                                const exitNormalLabel = createTextLabel('N₂', '#00ff88', 0.4);
                                exitNormalLabel.position.set(
                                    exitPoint.x + 2,
                                    exitPoint.y + 0.5,
                                    exitPoint.z
                                );
                                scene.add(exitNormalLabel);
                            }
                        }

                        const exitDir = calculateSnellRefraction(
                            refractedDir,
                            exitNormal,
                            refractiveIndex,  // Glass
                            1.0  // Air
                        );

                        if (exitDir) {
                            totalRefractionsCount++;
                            
                            const exitEndPoint = new Vector3(
                                exitPoint.x + exitDir.x * 4,
                                exitPoint.y + exitDir.y * 4,
                                exitPoint.z + exitDir.z * 4
                            );

                            // Draw exit ray
                            const exitPoints = [
                                new THREE.Vector3(exitPoint.x, exitPoint.y, exitPoint.z),
                                new THREE.Vector3(exitEndPoint.x, exitEndPoint.y, exitEndPoint.z)
                            ];
                            
                            const exitGeom = new THREE.BufferGeometry().setFromPoints(exitPoints);
                            const exitMaterial = new THREE.LineBasicMaterial({ 
                                color: 0xff3366,
                                linewidth: 3
                            });
                            const exitLine = new THREE.Line(exitGeom, exitMaterial);
                            scene.add(exitLine);
                            
                            // Glow
                            const exitGlowMaterial = new THREE.LineBasicMaterial({ 
                                color: 0xff3366,
                                linewidth: 8,
                                transparent: true,
                                opacity: 0.3
                            });
                            const exitGlow = new THREE.Line(exitGeom.clone(), exitGlowMaterial);
                            scene.add(exitGlow);

                            // ============================================================================
                            // REFLECTED RAY (Fresnel reflection)
                            // ============================================================================
                            
                            if (showReflection) {
                                const cosI = Math.abs(incidentDir.dot(entryNormal));
                                const reflectance = calculateFresnelReflectance(cosI, 1.0, refractiveIndex);
                                
                                // Reflection direction: R = I - 2(I·N)N
                                const reflectedDir = incidentDir.subtract(
                                    entryNormal.multiply(2 * incidentDir.dot(entryNormal))
                                ).normalize();
                                
                                const reflectedEndPoint = new Vector3(
                                    entryPoint.x + reflectedDir.x * 3,
                                    entryPoint.y + reflectedDir.y * 3,
                                    entryPoint.z + reflectedDir.z * 3
                                );

                                const reflectedPoints = [
                                    new THREE.Vector3(entryPoint.x, entryPoint.y, entryPoint.z),
                                    new THREE.Vector3(reflectedEndPoint.x, reflectedEndPoint.y, reflectedEndPoint.z)
                                ];
                                
                                const reflectedGeom = new THREE.BufferGeometry().setFromPoints(reflectedPoints);
                                const reflectedMaterial = new THREE.LineBasicMaterial({ 
                                    color: 0x00d4ff,
                                    linewidth: 2,
                                    transparent: true,
                                    opacity: reflectance
                                });
                                const reflectedLine = new THREE.Line(reflectedGeom, reflectedMaterial);
                                scene.add(reflectedLine);
                            }

                            // ============================================================================
                            // LABELS
                            // ============================================================================
                            
                            if (showLabels && i === 0) { // Only show labels for first ray
                                const incidentLabel = createTextLabel('Incident (I)', '#ff3366', 0.5);
                                incidentLabel.position.set(
                                    startPoint.x + 2,
                                    startPoint.y + 1.5,
                                    0
                                );
                                scene.add(incidentLabel);

                                const refractedLabel = createTextLabel('Refracted (T)', '#ffbe0b', 0.5);
                                refractedLabel.position.set(
                                    0,
                                    entryPoint.y - 2,
                                    0
                                );
                                scene.add(refractedLabel);

                                const exitLabel = createTextLabel('Transmitted', '#ff3366', 0.5);
                                exitLabel.position.set(
                                    exitPoint.x + 2.5,
                                    exitPoint.y + 1,
                                    0
                                );
                                scene.add(exitLabel);

                                if (showReflection) {
                                    const reflectedLabel = createTextLabel('Reflected (R)', '#00d4ff', 0.4);
                                    reflectedLabel.position.set(
                                        entryPoint.x - 1,
                                        entryPoint.y + 2,
                                        0
                                    );
                                    scene.add(reflectedLabel);
                                }
                            }

                            // ============================================================================
                            // UPDATE STATS (for first ray only)
                            // ============================================================================
                            
                            if (i === 0) {
                                const incidentAngleDeg = Math.acos(Math.abs(incidentDir.dot(entryNormal))) * 180 / Math.PI;
                                const refractedAngleDeg = Math.acos(Math.abs(refractedDir.dot(entryNormal))) * 180 / Math.PI;
                                const criticalAngleDeg = Math.asin(1.0 / refractiveIndex) * 180 / Math.PI;
                                const cosI = Math.abs(incidentDir.dot(entryNormal));
                                const fresnelR = calculateFresnelReflectance(cosI, 1.0, refractiveIndex);

                                setStats({
                                    incidentAngle: incidentAngleDeg.toFixed(2),
                                    refractedAngle: refractedAngleDeg.toFixed(2),
                                    reflectedAngle: (180 - incidentAngleDeg).toFixed(2),
                                    criticalAngle: criticalAngleDeg.toFixed(2),
                                    fresnelReflectance: (fresnelR * 100).toFixed(2),
                                    totalRefractions: totalRefractionsCount
                                });

                                setVectorData({
                                    incident: incidentDir,
                                    normal: entryNormal,
                                    refracted: refractedDir,
                                    reflected: incidentDir.subtract(
                                        entryNormal.multiply(2 * incidentDir.dot(entryNormal))
                                    ).normalize()
                                });
                            }
                        } else {
                            // Total internal reflection at exit
                            if (showLabels && i === 0) {
                                const tirLabel = createTextLabel('Total Internal Reflection!', '#ff006e', 0.6);
                                tirLabel.position.set(exitPoint.x, exitPoint.y + 2, 0);
                                scene.add(tirLabel);
                            }
                        }
                    } else {
                        // Total internal reflection at entry
                        if (showLabels && i === 0) {
                            const tirLabel = createTextLabel('Total Internal Reflection!', '#ff006e', 0.6);
                            tirLabel.position.set(entryPoint.x, entryPoint.y + 2, 0);
                            scene.add(tirLabel);
                        }
                    }
                }

                // ============================================================================
                // ANIMATION LOOP
                // ============================================================================
                
                let rotation = 0;
                const animate = () => {
                    animationRef.current = requestAnimationFrame(animate);
                    
                    if (autoRotate) {
                        rotation += rotationSpeed * 0.003;
                        cube.rotation.y = rotation;
                    }

                    updateCameraPosition();
                    renderer.render(scene, camera);
                };
                animate();

                // ============================================================================
                // CLEANUP
                // ============================================================================
                
                return () => {
                    if (animationRef.current) {
                        cancelAnimationFrame(animationRef.current);
                    }
                    renderer.dispose();
                    scene.clear();
                };

            }, [refractiveIndex, cubeSize, incidentAngle, rayCount, raySpread, rotationSpeed, 
                viewMode, autoRotate, showNormals, showLabels, showVectors, showGrid, showReflection]);

            // ============================================================================
            // RENDER UI
            // ============================================================================

            return (
                <div className="container">
                    <div className="header">
                        <h1>⚡ Vector Ray Tracing Kernel</h1>
                        <p className="subtitle">PROFESSIONAL 3D OPTICAL PHYSICS RENDERER</p>
                        <div>
                            <span className="badge">Snell's Law Implementation</span>
                            <span className="badge">Fresnel Equations</span>
                            <span className="badge">Real-time 3D</span>
                            <span className="badge">Vector Mathematics</span>
                        </div>
                    </div>

                    <div className="main-grid">
                        {/* LEFT PANEL - Controls */}
                        <div className="panel">
                            <h2>⚙️ Optical Parameters</h2>
                            
                            <div className="section">
                                <h3>Material Properties</h3>
                                <div className="slider-group">
                                    <div className="slider-label">
                                        <span>Refractive Index (η)</span>
                                        <span className="slider-value">{refractiveIndex.toFixed(3)}</span>
                                    </div>
                                    <input 
                                        type="range" 
                                        min="1.0" 
                                        max="2.8" 
                                        step="0.01" 
                                        value={refractiveIndex}
                                        onChange={(e) => setRefractiveIndex(parseFloat(e.target.value))}
                                    />
                                </div>

                                <div className="preset-grid">
                                    <button className="preset-btn" onClick={() => setRefractiveIndex(1.000)}>Vacuum</button>
                                    <button className="preset-btn" onClick={() => setRefractiveIndex(1.333)}>Water</button>
                                    <button className="preset-btn" onClick={() => setRefractiveIndex(1.520)}>Glass</button>
                                    <button className="preset-btn" onClick={() => setRefractiveIndex(1.544)}>Quartz</button>
                                    <button className="preset-btn" onClick={() => setRefractiveIndex(2.417)}>Diamond</button>
                                    <button className="preset-btn" onClick={() => setRefractiveIndex(2.650)}>Rutile</button>
                                </div>
                            </div>

                            <div className="section">
                                <h3>Geometry</h3>
                                <div className="slider-group">
                                    <div className="slider-label">
                                        <span>Cube Size (units)</span>
                                        <span className="slider-value">{cubeSize.toFixed(1)}</span>
                                    </div>
                                    <input 
                                        type="range" 
                                        min="1.0" 
                                        max="6.0" 
                                        step="0.1" 
                                        value={cubeSize}
                                        onChange={(e) => setCubeSize(parseFloat(e.target.value))}
                                    />
                                </div>
                            </div>

                            <div className="section">
                                <h3>Incident Ray</h3>
                                <div className="slider-group">
                                    <div className="slider-label">
                                        <span>Incident Angle (θᵢ)</span>
                                        <span className="slider-value">{incidentAngle}°</span>
                                    </div>
                                    <input 
                                        type="range" 
                                        min="0" 
                                        max="89" 
                                        step="1" 
                                        value={incidentAngle}
                                        onChange={(e) => setIncidentAngle(parseInt(e.target.value))}
                                    />
                                </div>

                                <div className="slider-group">
                                    <div className="slider-label">
                                        <span>Number of Rays</span>
                                        <span className="slider-value">{rayCount}</span>
                                    </div>
                                    <input 
                                        type="range" 
                                        min="1" 
                                        max="11" 
                                        step="1" 
                                        value={rayCount}
                                        onChange={(e) => setRayCount(parseInt(e.target.value))}
                                    />
                                </div>

                                {rayCount > 1 && (
                                    <div className="slider-group">
                                        <div className="slider-label">
                                            <span>Ray Spread (°)</span>
                                            <span className="slider-value">{raySpread}°</span>
                                        </div>
                                        <input 
                                            type="range" 
                                            min="0" 
                                            max="20" 
                                            step="1" 
                                            value={raySpread}
                                            onChange={(e) => setRaySpread(parseInt(e.target.value))}
                                        />
                                    </div>
                                )}
                            </div>

                            <div className="section">
                                <h3>Animation</h3>
                                <div className="slider-group">
                                    <div className="slider-label">
                                        <span>Rotation Speed</span>
                                        <span className="slider-value">{rotationSpeed.toFixed(1)}</span>
                                    </div>
                                    <input 
                                        type="range" 
                                        min="0" 
                                        max="5" 
                                        step="0.1" 
                                        value={rotationSpeed}
                                        onChange={(e) => setRotationSpeed(parseFloat(e.target.value))}
                                    />
                                </div>

                                <div className="toggle-switch">
                                    <input 
                                        type="checkbox" 
                                        id="autoRotate"
                                        checked={autoRotate}
                                        onChange={(e) => setAutoRotate(e.target.checked)}
                                    />
                                    <label htmlFor="autoRotate">Auto-Rotate Cube</label>
                                </div>
                            </div>

                            <div className="section">
                                <h3>Display Options</h3>
                                <div className="toggle-switch">
                                    <input 
                                        type="checkbox" 
                                        id="showNormals"
                                        checked={showNormals}
                                        onChange={(e) => setShowNormals(e.target.checked)}
                                    />
                                    <label htmlFor="showNormals">Show Normal Vectors (N)</label>
                                </div>

                                <div className="toggle-switch">
                                    <input 
                                        type="checkbox" 
                                        id="showLabels"
                                        checked={showLabels}
                                        onChange={(e) => setShowLabels(e.target.checked)}
                                    />
                                    <label htmlFor="showLabels">Show Labels</label>
                                </div>

                                <div className="toggle-switch">
                                    <input 
                                        type="checkbox" 
                                        id="showReflection"
                                        checked={showReflection}
                                        onChange={(e) => setShowReflection(e.target.checked)}
                                    />
                                    <label htmlFor="showReflection">Show Fresnel Reflection</label>
                                </div>

                                <div className="toggle-switch">
                                    <input 
                                        type="checkbox" 
                                        id="showGrid"
                                        checked={showGrid}
                                        onChange={(e) => setShowGrid(e.target.checked)}
                                    />
                                    <label htmlFor="showGrid">Show Grid & Axes</label>
                                </div>
                            </div>
                        </div>

                        {/* CENTER PANEL - 3D Visualization */}
                        <div>
                            <div className="panel" style={{padding: 0, overflow: 'hidden'}}>
                                <div className="canvas-container">
                                    <canvas ref={canvasRef}></canvas>
                                    
                                    <div className="canvas-overlay">
                                        <h4>📐 Snell's Law (Vector Form)</h4>
                                        <p>T = ηI + (η cos θᵢ - cos θₜ)N</p>
                                        <p style={{marginTop: '8px', fontSize: '0.75em'}}>
                                            where η = n₁/n₂<br/>
                                            cos θₜ = √(1 - η²(1 - cos²θᵢ))
                                        </p>
                                    </div>
                                </div>

                                <div style={{padding: '20px'}}>
                                    <div className="section">
                                        <h3>Camera View</h3>
                                        <div className="view-mode-buttons">
                                            <button 
                                                className={viewMode === 'perspective' ? 'active' : ''}
                                                onClick={() => setViewMode('perspective')}
                                            >
                                                3D Perspective
                                            </button>
                                            <button 
                                                className={viewMode === 'top' ? 'active' : ''}
                                                onClick={() => setViewMode('top')}
                                            >
                                                Top View
                                            </button>
                                            <button 
                                                className={viewMode === 'side' ? 'active' : ''}
                                                onClick={() => setViewMode('side')}
                                            >
                                                Side View
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* RIGHT PANEL - Vector Data & Stats */}
                        <div className="panel">
                            <h2>📊 Physics Analysis</h2>
                            
                            <div className="section">
                                <h3>Vector Components</h3>
                                
                                <div style={{marginBottom: '15px'}}>
                                    <div style={{color: '#ff3366', marginBottom: '5px', fontSize: '0.9em'}}>
                                        Incident Vector (I)
                                    </div>
                                    <div className="vector-display">
                                        <div className="vector-component">
                                            <div className="label">x</div>
                                            <div className="val">{vectorData.incident.x.toFixed(3)}</div>
                                        </div>
                                        <div className="vector-component">
                                            <div className="label">y</div>
                                            <div className="val">{vectorData.incident.y.toFixed(3)}</div>
                                        </div>
                                        <div className="vector-component">
                                            <div className="label">z</div>
                                            <div className="val">{vectorData.incident.z.toFixed(3)}</div>
                                        </div>
                                    </div>
                                </div>

                                <div style={{marginBottom: '15px'}}>
                                    <div style={{color: '#00ff88', marginBottom: '5px', fontSize: '0.9em'}}>
                                        Normal Vector (N)
                                    </div>
                                    <div className="vector-display">
                                        <div className="vector-component">
                                            <div className="label">x</div>
                                            <div className="val">{vectorData.normal.x.toFixed(3)}</div>
                                        </div>
                                        <div className="vector-component">
                                            <div className="label">y</div>
                                            <div className="val">{vectorData.normal.y.toFixed(3)}</div>
                                        </div>
                                        <div className="vector-component">
                                            <div className="label">z</div>
                                            <div className="val">{vectorData.normal.z.toFixed(3)}</div>
                                        </div>
                                    </div>
                                </div>

                                <div style={{marginBottom: '15px'}}>
                                    <div style={{color: '#ffbe0b', marginBottom: '5px', fontSize: '0.9em'}}>
                                        Refracted Vector (T)
                                    </div>
                                    <div className="vector-display">
                                        <div className="vector-component">
                                            <div className="label">x</div>
                                            <div className="val">{vectorData.refracted.x.toFixed(3)}</div>
                                        </div>
                                        <div className="vector-component">
                                            <div className="label">y</div>
                                            <div className="val">{vectorData.refracted.y.toFixed(3)}</div>
                                        </div>
                                        <div className="vector-component">
                                            <div className="label">z</div>
                                            <div className="val">{vectorData.refracted.z.toFixed(3)}</div>
                                        </div>
                                    </div>
                                </div>

                                {showReflection && (
                                    <div style={{marginBottom: '15px'}}>
                                        <div style={{color: '#00d4ff', marginBottom: '5px', fontSize: '0.9em'}}>
                                            Reflected Vector (R)
                                        </div>
                                        <div className="vector-display">
                                            <div className="vector-component">
                                                <div className="label">x</div>
                                                <div className="val">{vectorData.reflected.x.toFixed(3)}</div>
                                            </div>
                                            <div className="vector-component">
                                                <div className="label">y</div>
                                                <div className="val">{vectorData.reflected.y.toFixed(3)}</div>
                                            </div>
                                            <div className="vector-component">
                                                <div className="label">z</div>
                                                <div className="val">{vectorData.reflected.z.toFixed(3)}</div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>

                            <div className="section">
                                <h3>Optical Statistics</h3>
                                <div className="stats-grid">
                                    <div className="stat-card">
                                        <h4>Incident Angle</h4>
                                        <div className="value">
                                            {stats.incidentAngle}
                                            <span className="unit">deg</span>
                                        </div>
                                        <div className="info-badge">θᵢ</div>
                                    </div>

                                    <div className="stat-card">
                                        <h4>Refracted Angle</h4>
                                        <div className="value">
                                            {stats.refractedAngle}
                                            <span className="unit">deg</span>
                                        </div>
                                        <div className="info-badge">θₜ</div>
                                    </div>

                                    <div className="stat-card">
                                        <h4>Critical Angle</h4>
                                        <div className="value">
                                            {stats.criticalAngle}
                                            <span className="unit">deg</span>
                                        </div>
                                        <div className="info-badge">θc = arcsin(1/η)</div>
                                    </div>

                                    <div className="stat-card">
                                        <h4>Fresnel Reflectance</h4>
                                        <div className="value">
                                            {stats.fresnelReflectance}
                                            <span className="unit">%</span>
                                        </div>
                                        <div className="info-badge">R = (Rs + Rp)/2</div>
                                    </div>

                                    <div className="stat-card">
                                        <h4>Total Refractions</h4>
                                        <div className="value">{stats.totalRefractions}</div>
                                        <div className="info-badge">Entry + Exit</div>
                                    </div>

                                    <div className="stat-card">
                                        <h4>Index Ratio</h4>
                                        <div className="value">
                                            {(1.0 / refractiveIndex).toFixed(3)}
                                        </div>
                                        <div className="info-badge">η = n₁/n₂</div>
                                    </div>
                                </div>
                            </div>

                            <div className="section">
                                <h3>Mathematical Formulas</h3>
                                <div className="math-formula">
                                    <strong>Snell's Law (Scalar):</strong><br/>
                                    n₁ sin θᵢ = n₂ sin θₜ
                                </div>
                                <div className="math-formula">
                                    <strong>Vector Form:</strong><br/>
                                    T = ηI + (η cos θᵢ - √(1-η²sin²θᵢ))N
                                </div>
                                <div className="math-formula">
                                    <strong>Fresnel (s-polarization):</strong><br/>
                                    Rs = ((n₁cosθᵢ - n₂cosθₜ)/(n₁cosθᵢ + n₂cosθₜ))²
                                </div>
                                <div className="math-formula">
                                    <strong>Critical Angle:</strong><br/>
                                    θc = arcsin(n₂/n₁)
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="panel" style={{textAlign: 'center', padding: '30px'}}>
                        <h2>🎓 Educational Notes</h2>
                        <p style={{lineHeight: '1.8', color: 'var(--text-secondary)', maxWidth: '900px', margin: '15px auto'}}>
                            This interactive visualization demonstrates <strong>Snell's Law</strong> in its vector form, 
                            showing how light bends when transitioning between media with different refractive indices. 
                            The simulation includes <strong>Fresnel equations</strong> to calculate the reflected light intensity 
                            and handles <strong>total internal reflection</strong> when the incident angle exceeds the critical angle.
                            All ray directions are calculated using proper 3D vector mathematics with normalized direction vectors.
                        </p>
                        <div style={{marginTop: '20px', display: 'flex', gap: '10px', justifyContent: 'center', flexWrap: 'wrap'}}>
                            <span className="badge">OpenGL/WebGL Compatible</span>
                            <span className="badge">Three.js Rendering</span>
                            <span className="badge">Real-time Physics</span>
                            <span className="badge">Educational Tool</span>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<RayTracingKernel />, document.getElementById('root'));
    </script>
</body>
</html>
